<!doctype html>
<html lang="en">
<head><title>Art search</title></head>
<body>
  <h1>Art Search</h1>
  {% if message %}
       <p>{{ message }}</p>
     {% endif %}

  <form action="/results" method="get">
    <label for="term">Search by title, artist, or type</label>
    <input id="term" name="term_search">
    <button type="submit">Find artworks</button>
  </form>
</body>
</html>
